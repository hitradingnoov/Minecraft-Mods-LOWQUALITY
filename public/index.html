<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buxify - Gaming Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f1015;
            color: #ffffff;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #15171e;
            border-bottom: 1px solid #222634;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #6366f1;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .login-btn {
            background-color: #6366f1;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background-color: #4f46e5;
        }
        .hero {
            text-align: center;
            padding: 100px 20px;
        }
        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .hero p {
            color: #9ca3af;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .auth-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .auth-option-btn {
            padding: 10px 20px;
            border-radius: 6px;
            color: white;
            text-decoration: none;
            font-weight: 500;
        }
        .btn-google { background-color: #db4437; }
        .btn-roblox { background-color: #000000; border: 1px solid #333; }
        .btn-discord { background-color: #5865F2; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">Buxify</a>
        <div class="nav-links">
            <a href="#" class="login-btn">Log in</a>
        </div>
    </header>

    <main class="hero">
        <h1>Welcome to Buxify</h1>
        <p>The ultimate dark-themed gaming platform. Choose your login provider below:</p>
        
        <div class="auth-options">
            <a href="/auth/google" class="auth-option-btn btn-google">Google ile Giriş</a>
            <a href="/auth/roblox" class="auth-option-btn btn-roblox">Roblox ile Giriş</a>
            <a href="/auth/discord" class="auth-option-btn btn-discord">Discord ile Giriş</a>
        </div>
    </main>

    <script>
        // URL'den giriş verilerini yakalayıp arayüzü güncelleme
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('login') === 'success') {
            const username = urlParams.get('user');
            
            const authButton = document.querySelector('.login-btn');
            if (authButton) {
                authButton.innerHTML = `👤 ${username}`;
                authButton.href = "#";
                authButton.style.backgroundColor = "#10b981"; // Başarılı giriş rengi (Yeşil)
            }
            
            // Adres çubuğunu temizle
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
</body>
</html>
