<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buxify</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        aside.sidebar {
            width: 220px;
            background-color: #12141c;
            border-right: 1px solid #1a1d26;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 4px;
        }
        .logo {
            font-size: 18px;
            font-weight: 700;
            color: #fbbf24;
            text-decoration: none;
            margin-bottom: 15px;
            padding: 5px;
        }
        .nav-item {
            color: #8b92a2;
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            display: block;
        }
        .nav-item:hover, .nav-item.active {
            background-color: #1a1d26;
            color: #fff;
        }
        .nav-item.active {
            color: #fbbf24;
        }

        /* Main layout */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background-color: #0f1015;
        }
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 12px 25px;
            background-color: #12141c;
            border-bottom: 1px solid #1a1d26;
        }
        .login-btn {
            background-color: #fbbf24;
            color: #0b0c10;
            padding: 6px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
        }
        .login-btn:hover {
            background-color: #f59e0b;
        }

        /* Content */
        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .hero-banner {
            background-color: #151821;
            border: 1px solid #1f2330;
            border-radius: 8px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hero-text h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .hero-text h1 span {
            color: #fbbf24;
        }
        .hero-text p {
            color: #8b92a2;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .auth-buttons {
            display: flex;
            gap: 8px;
        }
        .auth-btn {
            padding: 6px 14px;
            border-radius: 4px;
            color: white;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-discord { background-color: #5865F2; }
        .btn-google { background-color: #db4437; }
        .btn-roblox { background-color: #222; border: 1px solid #444; }

        .game-cards-preview {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .mini-game-card {
            background-color: #1b1f2b;
            border: 1px solid #262c3d;
            border-radius: 6px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fbbf24;
            font-size: 13px;
        }

        /* Chat */
        aside.chat-sidebar {
            width: 260px;
            background-color: #12141c;
            border-left: 1px solid #1a1d26;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }
        .chat-header {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
            border-bottom: 1px solid #1a1d26;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-msg {
            background-color: #171a23;
            padding: 6px 10px;
            border-radius: 4px;
        }
        .chat-msg .user {
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 2px;
        }
        .chat-msg .text {
            color: #b0b5c1;
        }
        .chat-input-box {
            margin-top: 10px;
            display: flex;
            background-color: #171a23;
            border: 1px solid #262c3d;
            border-radius: 4px;
        }
        .chat-input-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px;
            color: white;
            font-size: 12px;
            outline: none;
        }
        .chat-input-box button {
            background-color: #fbbf24;
            border: none;
            padding: 0 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <a href="/" class="logo">BLOXGAME</a>
        <a href="#" class="nav-item active">Casino</a>
        <a href="#" class="nav-item">Slots</a>
        <a href="#" class="nav-item">Blackjack</a>
        <a href="#" class="nav-item">Roulette</a>
        <a href="#" class="nav-item">Crash</a>
    </aside>

    <div class="main-wrapper">
        <header>
            <a href="#" class="login-btn">Log in</a>
        </header>

        <div class="content">
            <div class="hero-banner">
                <div class="hero-text">
                    <h1>Bet, win, and cash out <span>your way.</span></h1>
                    <p>Deposit instantly with crypto, cards or gift cards.</p>
                    <div style="font-size: 12px; color: #8b92a2; margin-bottom: 6px;">or continue with:</div>
                    <div class="auth-buttons">
                        <a href="/auth/discord" class="auth-btn btn-discord">Discord</a>
                        <a href="/auth/google" class="auth-btn btn-google">Google</a>
                        <a href="/auth/roblox" class="auth-btn btn-roblox">Roblox</a>
                    </div>
                </div>
                <div class="game-cards-preview">
                    <div class="mini-game-card">FISHERMAN</div>
                    <div class="mini-game-card">THE COUNT</div>
                    <div class="mini-game-card">BONANZA</div>
                </div>
            </div>
        </div>
    </div>

    <aside class="chat-sidebar">
        <div class="chat-header">
            <span>Chat</span>
            <span>72 online</span>
        </div>
        <div class="chat-messages">
            <div class="chat-msg">
                <div class="user">beedu2001</div>
                <div class="text">heh</div>
            </div>
            <div class="chat-msg">
                <div class="user">raichu3974</div>
                <div class="text">so close</div>
            </div>
            <div class="chat-msg">
                <div class="user">denis</div>
                <div class="text">I tought it's by 3</div>
            </div>
        </div>
        <div class="chat-input-box">
            <input type="text" placeholder="Enter your message here...">
            <button>💬</button>
        </div>
    </aside>

    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        const cookieValue = getCookie('buxify_user');
        if (cookieValue) {
            const username = decodeURIComponent(cookieValue);
            const authButton = document.querySelector('.login-btn');
            if (authButton) {
                authButton.innerHTML = `${username}`;
                authButton.href = "#";
                authButton.style.backgroundColor = "#10b981";
                authButton.style.color = "#ffffff";
            }
        }
    </script>
</body>
</html>
