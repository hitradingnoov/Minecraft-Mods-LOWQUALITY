<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxGame - User Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #08090d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background-color: #0f1118;
            border-bottom: 1px solid #1a1e2b;
        }
        .header-left { display: flex; align-items: center; gap: 25px; }
        .logo { font-size: 22px; font-weight: 900; color: #ffffff; text-decoration: none; }
        .logo span { color: #8b5cf6; }
        .nav-links { display: flex; gap: 18px; font-size: 13px; }
        .nav-links a { color: #8b92a2; text-decoration: none; font-weight: 600; }
        .nav-links a:hover { color: #fff; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .balance-box {
            background-color: #171a26;
            border: 1px solid #252a3d;
            border-radius: 8px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 13px;
            color: #fbbf24;
        }

        /* MAIN CONTAINER */
        .profile-container {
            max-width: 1000px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* BANNER & CARD HEAD */
        .profile-card {
            background-color: #0f1118;
            border: 1px solid #1a1e2b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 24px;
        }
        .profile-banner {
            height: 140px;
            background: linear-gradient(135deg, #3b136b 0%, #0f1118 100%);
            border-bottom: 1px solid #1a1e2b;
            position: relative;
        }
        .profile-info-header {
            padding: 0 30px 24px 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: -50px;
            position: relative;
        }
        .user-main-details {
            display: flex;
            align-items: flex-end;
            gap: 20px;
        }
        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #0f1118;
            background-color: #131621;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }
        .user-titles h1 {
            font-size: 24px;
            font-weight: 800;
        }
        .user-id {
            font-size: 12px;
            color: #8b92a2;
            margin-top: 2px;
        }

        /* WHALE BADGES */
        .badge-tag {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .badge-member { background: #1e2333; color: #9ca3af; border: 1px solid #374151; }
        .badge-whale { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: #fff; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        .badge-gold-whale { background: linear-gradient(135deg, #d97706, #fbbf24); color: #000; box-shadow: 0 0 12px rgba(251, 191, 36, 0.4); }
        .badge-plat-whale { background: linear-gradient(135deg, #06b6d4, #e0e7ff); color: #0f172a; box-shadow: 0 0 15px rgba(6, 182, 212, 0.5); }

        .btn-logout {
            background-color: #27141a;
            color: #ef4444;
            border: 1px solid #451a24;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-logout:hover { background-color: #3b1822; color: #f87171; }

        /* WAGER PROGRESS BAR */
        .wager-progress-section {
            padding: 0 30px 24px 30px;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #8b92a2;
        }
        .progress-bar-bg {
            background-color: #131621;
            border: 1px solid #1e2333;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #8b5cf6, #3b82f6);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        .stat-card {
            background-color: #0f1118;
            border: 1px solid #1a1e2b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-label { font-size: 11px; color: #8b92a2; font-weight: 700; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: 800; color: #fbbf24; margin-top: 6px; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="/" class="logo">BLOX<span>GAME</span></a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="#">Affiliates</a>
                <a href="#">Rewards</a>
                <a href="#">Leaderboard</a>
            </div>
        </div>
        <div class="header-right">
            <div class="balance-box">
                <span>💎</span>
                <span id="user-balance">0.00</span> RBX
            </div>
        </div>
    </header>

    <div class="profile-container">
        
        <div class="profile-card">
            <div class="profile-banner"></div>
            <div class="profile-info-header">
                <div class="user-main-details">
                    <img src="" id="profile-avatar" class="profile-avatar" alt="Avatar" onerror="this.src='https://tr.rbxcdn.com/30DAY-AvatarHeadshot-1-Png/150/150/AvatarHeadshot/Png'">
                    <div class="user-titles">
                        <h1 id="profile-username">User</h1>
                        <div class="user-id">ROBLOX ID: <span id="profile-id">000000</span></div>
                        <div id="whale-badge" class="badge-tag badge-member">MEMBER</div>
                    </div>
                </div>
                <button class="btn-logout" id="btn-logout">Log Out</button>
            </div>

            <!-- Wager Seviye İlerleme Çubuğu -->
            <div class="wager-progress-section">
                <div class="progress-header">
                    <span>NEXT TIER PROGRESS</span>
                    <span id="progress-text">0 / 1,000,000 Wager</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
            </div>
        </div>

        <!-- İstatistikler -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Wagered</div>
                <div class="stat-value" id="stat-wager">💎 0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Profit / Wins</div>
                <div class="stat-value" id="stat-wins">💎 0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Games Played</div>
                <div class="stat-value" id="stat-games">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Account Rank</div>
                <div class="stat-value" id="stat-rank" style="color: #8b5cf6;">MEMBER</div>
            </div>
        </div>

    </div>

    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        const userCookie = getCookie('user_session');
        if (!userCookie) {
            // Giriş yapmamışsa ana sayfaya yönlendir
            window.location.href = '/';
        } else {
            try {
                const userData = JSON.parse(decodeURIComponent(userCookie));

                // Ekran Bilgilerini Doldur
                document.getElementById('profile-username').textContent = userData.username;
                document.getElementById('profile-id').textContent = userData.id || 'N/A';
                document.getElementById('user-balance').textContent = Number(userData.balance || 0).toLocaleString();
                if (userData.avatar) {
                    document.getElementById('profile-avatar').src = userData.avatar;
                }

                // Wager Hesaplama & Whale Rol Sistemi
                const wager = Number(userData.wager || 0); // Varsayılan wager tutarı
                const wins = Number(userData.wins || 0);
                const games = Number(userData.games || 0);

                document.getElementById('stat-wager').textContent = '💎 ' + wager.toLocaleString();
                document.getElementById('stat-wins').textContent = '💎 ' + wins.toLocaleString();
                document.getElementById('stat-games').textContent = games;

                const badgeEl = document.getElementById('whale-badge');
                const rankStatEl = document.getElementById('stat-rank');
                const progressText = document.getElementById('progress-text');
                const progressFill = document.getElementById('progress-fill');

                let rankName = 'MEMBER';
                let badgeClass = 'badge-member';
                let nextTarget = 1000000;

                if (wager >= 10000000) {
                    rankName = '💎 PLAT WHALE';
                    badgeClass = 'badge-plat-whale';
                    nextTarget = 10000000;
                    progressText.textContent = 'MAX TIER REACHED!';
                    progressFill.style.width = '100%';
                } else if (wager >= 5000000) {
                    rankName = '🥇 GOLD WHALE';
                    badgeClass = 'badge-gold-whale';
                    nextTarget = 10000000;
                    let pct = ((wager - 5000000) / 5000000) * 100;
                    progressFill.style.width = pct + '%';
                    progressText.textContent = `${wager.toLocaleString()} / 10,000,000 Wager`;
                } else if (wager >= 1000000) {
                    rankName = '🐳 WHALE';
                    badgeClass = 'badge-whale';
                    nextTarget = 5000000;
                    let pct = ((wager - 1000000) / 4000000) * 100;
                    progressFill.style.width = pct + '%';
                    progressText.textContent = `${wager.toLocaleString()} / 5,000,000 Wager`;
                } else {
                    rankName = 'MEMBER';
                    badgeClass = 'badge-member';
                    nextTarget = 1000000;
                    let pct = (wager / 1000000) * 100;
                    progressFill.style.width = pct + '%';
                    progressText.textContent = `${wager.toLocaleString()} / 1,000,000 Wager`;
                }

                badgeEl.textContent = rankName;
                badgeEl.className = 'badge-tag ' + badgeClass;
                rankStatEl.textContent = rankName;

            } catch(e) {
                console.error("Profile error", e);
            }
        }

        document.getElementById('btn-logout').addEventListener('click', () => {
            document.cookie = 'user_session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            window.location.href = '/';
        });
    </script>
</body>
</html>
